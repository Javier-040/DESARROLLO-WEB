    <h1>Javascript Fomrulario</h1>
<form id="formulario">
<input id="nombre" type="text" />
<button type="submit">Guardar</button>
</form>

<script>
const formulario = document.getElementById("formulario");
formulario.addEventListener("submit", (evento) => {
evento.preventDefault(); // evita que la página se recargue
const nombre = document.getElementById("nombre").value; // obtiene el valor del input
alert("Dato guardado!");
console.log("Nombre:", nombre); // muestra el dato en consola
});
</script>
